<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jorge Carlos - Kenny Calderón</title>
    <meta name="description" content="Conoce a Jorge Carlos, uno de los personajes de Kenny Calderón.">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-blur character-bg-jorgecarlos"></div>
    <div class="background-overlay"></div>

    <main class="container">
        <!-- Header con botón de regreso -->
        <div class="character-page-header">
            <a href="index.html" class="back-button" aria-label="Volver al inicio">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12,19 5,12 12,5"></polyline>
                </svg>
            </a>
        </div>

        <!-- Hero del personaje -->
        <div class="character-hero">
            <img src="images/optimized/jorgecarlos-portrait-480.webp"
                    srcset="images/optimized/jorgecarlos-portrait-480.webp 480w, images/optimized/jorgecarlos-portrait-1080.webp 1080w"
                    sizes="(max-width: 540px) 100vw, 540px" width="3132" height="4698"
                    loading="eager" decoding="async" fetchpriority="high" alt="Jorge Carlos" class="character-hero-image">
            <div class="character-hero-gradient"></div>
            <div class="character-hero-text">
            </div>
        </div>

        <!-- Contenido del personaje -->
        <div class="character-content">
            <section class="character-bio">
                <h2>JORGE CARLOS</h2>
                <p>Un niño muy Travieso de 5 años muy inteligente ya que creció rodeado de adultos, consentido,
                    irreverente, conveniente, con proyección a futuro de convertirse en una gran estrella ⭐️</p>
            </section>

            <!-- Botón para volver -->
            <section class="character-back">
                <a href="index.html" class="btn-primary">← Volver al inicio</a>

        </div>

</html>
