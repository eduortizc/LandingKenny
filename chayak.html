<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chayak - Kenny Calderón</title>
    <meta name="description" content="Conoce a Chayak, uno de los personajes más icónicos de Kenny Calderón.">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/favicon.png">
</head>

<body>
    <div class="background-blur character-bg-chayak"></div>
    <div class="background-overlay"></div>

    <main class="container">
        <!-- Header con botón de regreso -->
        <div class="character-page-header">
            <a href="index.html" class="back-button" aria-label="Volver al inicio">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12,19 5,12 12,5"></polyline>
                </svg>
            </a>
        </div>

        <!-- Hero del personaje -->
        <div class="character-hero">
            <img src="images/papelera/chayak1.JPEG" alt="Chayak" class="character-hero-image">
            <div class="character-hero-gradient"></div>
            <div class="character-hero-text">
            </div>
        </div>

        <!-- Contenido del personaje -->
        <div class="character-content">
            <section class="character-bio">
                <h2>CHAYAK</h2>
                <p>Es un yucateco atrevido con más de 20 años de trayectoria que viene de su pueblo “Chumayel” a la gran
                    cuidad a estudiar, trabajar, triunfar y dispuesto a robarce los corazones de todo Mérida 🫶🏻</p>
                <ul>
                    <li>Teatrero</li>
                    <li>Comediante</li>
                    <li>Conductor</li>
                    <li>Rey del carnaval de Mérida</li>
                </ul>
            </section>

            <!-- Botón para volver -->
            <section class="character-back">
                <a href="index.html" class="btn-primary">← Volver al inicio</a>
            </section>
        </div>
    </main>
</body>

</html>
